name: sanluquitas

services:
  # ======================== MOODLE ========================
  moodle-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME}
      MARIADB_USER: ${MOODLE_DB_USER}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - moodle_db:/var/lib/mysql
    networks: [moodle]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  moodle-app:
    build: ./moodle
    image: sanluquitas/moodle-php:8.3
    restart: unless-stopped
    environment: &moodle_env
      MOODLE_HOST: ${MOODLE_HOST}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
    volumes: &moodle_vols
      - ./moodle/src:/var/www/moodle:ro
      - ./moodle/config.php:/var/www/moodle/config.php:ro
      - ./moodle/plugins/simple:/var/www/moodle/public/course/format/simple:ro
      - moodledata:/var/moodledata
    networks: [moodle]
    depends_on:
      moodle-db:
        condition: service_healthy

  moodle-cron:
    image: sanluquitas/moodle-php:8.3
    restart: unless-stopped
    user: www-data
    environment: *moodle_env
    volumes: *moodle_vols
    networks: [moodle]
    command: sh -c "while true; do php ${MOODLE_CLI}/cron.php; sleep 60; done"
    depends_on: [moodle-app]

  moodle-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./moodle/src:/var/www/moodle:ro
      - ./moodle/nginx/moodle.conf:/etc/nginx/conf.d/default.conf:ro
      - ./moodle/plugins/simple:/var/www/moodle/public/course/format/simple:ro
    networks: [moodle]
    depends_on: [moodle-app]

  
  # ======================== LARAVEL ========================
  laravel-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LARAVEL_DB_NAME}
      POSTGRES_USER: ${LARAVEL_DB_USER}
      POSTGRES_PASSWORD: ${LARAVEL_DB_PASSWORD}
    volumes:
      - laravel_db:/var/lib/postgresql/data
    networks: [laravel]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LARAVEL_DB_USER} -d ${LARAVEL_DB_NAME}"]
      interval: 10s
      retries: 10

  laravel-app:
    build:
      context: ./laravel-docker
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    image: sanluquitas/laravel-php:8.3
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www/html
    networks: [laravel]
    depends_on:
      laravel-db:
        condition: service_healthy

  laravel-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./laravel:/var/www/html:ro
      - ./laravel-docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [laravel]
    depends_on: [laravel-app]

networks:
  moodle:
  laravel:

volumes:
  moodle_db:
  moodledata:
  laravel_db:
