server {
    listen 80;
    server_name _;
    root /var/www/moodle/public;
    index index.php;
    client_max_body_size 64M;

    # Router de Moodle 5.x: si el archivo no existe, lo atiende r.php
    location / {
        try_files $uri $uri/ /r.php;
    }

    # PHP -> contenedor moodle-app (PHP-FPM), con soporte de "slash arguments"
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass moodle-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Bloquear archivos ocultos (.git, .env, etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
